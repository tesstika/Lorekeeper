<script>
    // Accordion Toggle Behavior
    function toggleAccordion(contentId, iconId) {
      const content = document.getElementById(contentId);
      const icon = document.getElementById(iconId);

      if (content.classList.contains('hidden')) {
        content.classList.remove('hidden');
        icon.classList.add('rotate-180');
        icon.classList.add('text-primary');
        icon.classList.remove('text-on-surface-variant');
      } else {
        content.classList.add('hidden');
        icon.classList.remove('rotate-180');
        icon.classList.remove('text-primary');
        icon.classList.add('text-on-surface-variant');
      }
    }

    // Temperature slider display update
    function updateTemp(val) {
      const display = document.getElementById('tempValue');
      let descriptor = "Balanced";
      if (val < 0.5) descriptor = "Strictly Grounded";
      else if (val <= 0.9) descriptor = "Literary Flamboyance";
      else descriptor = "Wild & Uninhibited";
      display.innerText = `${val} (${descriptor})`;
    }

    // Mode Switcher between Character & Persona
    function setMode(mode) {
      const charBtn = document.getElementById('btnModeCharacter');
      const personaBtn = document.getElementById('btnModePersona');
      const saveLabel = document.getElementById('saveLabel');

      if (mode === 'character') {
        charBtn.className = "flex-1 py-1.5 px-3 rounded-lg text-label-md font-label-md transition-all duration-200 bg-surface-container-high text-primary shadow-sm flex items-center justify-center gap-1.5 font-medium";
        personaBtn.className = "flex-1 py-1.5 px-3 rounded-lg text-label-md font-label-md text-on-surface-variant hover:text-on-surface transition-all duration-200 flex items-center justify-center gap-1.5";
        saveLabel.innerText = "Save Character";
      } else {
        personaBtn.className = "flex-1 py-1.5 px-3 rounded-lg text-label-md font-label-md transition-all duration-200 bg-surface-container-high text-tertiary-container shadow-sm flex items-center justify-center gap-1.5 font-medium";
        charBtn.className = "flex-1 py-1.5 px-3 rounded-lg text-label-md font-label-md text-on-surface-variant hover:text-on-surface transition-all duration-200 flex items-center justify-center gap-1.5";
        saveLabel.innerText = "Save Persona";
      }
    }
  </script>
